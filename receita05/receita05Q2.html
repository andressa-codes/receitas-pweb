<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>

  <body>
    <div id="original">
      <button id="btnCarregar">Carregando sorvetes...</button>
    </div>
    <div id="ordenadas">
      <button id="btnOrdenar">Carregando sorvetes ordenados...</button>
    </div>
    <div id="embaralhadas">
      <button id="btnEmbaralhar">Carregando sorvetes embaralhados...</button>
    </div>
    <link rel="stylesheet" href="receita05.css" />
  </body>

  <script>
    let sorvetes = ["Chocolate", "Morango", "Baunilha"];
    let ordenados = [...sorvetes].sort();
    let embaralhados = [...sorvetes].sort(() => Math.random() - 0.5);

    const transformar = (item) => {
      return `<tr><td>${item}</td></tr>`;
    };

    const carregar = () => {
      let div = document.getElementById("original");
      let html = sorvetes.map(transformar).join("");
      div.innerHTML = `
        <table class="sorvetes">
          <tr><th>Sorvetes</th></tr>
          ${html}
        </table>
      `;
    };

    const ordenar = () => {
      let div = document.getElementById("ordenadas");
      let html = ordenados.map(transformar).join("");
      div.innerHTML = `
        <table class="sorvetes">
          <tr><th>Sorvetes</th></tr>
          ${html}
        </table>
      `;
    };

    const embaralhar = () => {
      let div = document.getElementById("embaralhadas");
      let html = embaralhados.map(transformar).join("");
      div.innerHTML = `
        <table class="sorvetes">
          <tr><th>Sorvetes</th></tr>
          ${html}
        </table>
      `;
    };

    let btnCarregar = document.getElementById("btnCarregar");
    btnCarregar.addEventListener("click", carregar);

    let btnOrdenar = document.getElementById("btnOrdenar");
    btnOrdenar.addEventListener("click", ordenar);

    let btnEmbaralhar = document.getElementById("btnEmbaralhar");
    btnEmbaralhar.addEventListener("click", embaralhar);
  </script>
</html>
